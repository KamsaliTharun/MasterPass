{% extends 'base.html' %}
{% block title %}Login - My App{% endblock %}

{% block content %}
  <div style="max-width:520px;margin:0 auto">
    <h2 style="margin-top:0">Welcome back</h2>
    <p class="muted">Sign in to continue.</p>

    <form action="{% url 'login' %}" method="post" class="card" style="margin-top:18px">
      {% csrf_token %}
      <div class="form-row">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" value="{{ request.POST.username|default:'' }}" autocomplete="username">
      </div>

      <div class="form-row">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password">
      </div>

      <div class="form-actions">
        <button class="btn btn-primary" type="submit">Sign in</button>
        <a class="btn btn-ghost" href="{% url 'register' %}">Create account</a>
        <a class="btn btn-ghost" href="{% url 'forgot_password' %}">Forgot password?</a>
      </div>
    </form>
  </div>
{% endblock %}
