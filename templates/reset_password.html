{% extends 'base.html' %}
{% block title %}Reset Password{% endblock %}

{% block content %}

    <div style="max-width:520px;margin:0 auto">
        <h2 style="margin-top:0">Reset Password</h2>
        <p class="muted">Enter your email address to reset your password.</p>
    
        <form action="{% url 'reset_password' %}" method="post" class="card" style="margin-top:18px">
        {% csrf_token %}
        <div class="form-row">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" value="{{ request.POST.password|default:'' }}" autocomplete="new-password">
            <label for="confirm_password">Confirm Password</label>
            <input id="confirm_password" name="confirm_password" type="password" value="{{ request.POST.confirm_password|default:'' }}" autocomplete="new-password">
        </div>
    
        <div class="form-actions">
            <button class="btn btn-primary" type="submit">Reset Password</button>
            <a href="{% url 'home' %}" class="btn btn-danger">Cancel</a>
        </div>
        </form>
    </div>
    {% endblock %}
